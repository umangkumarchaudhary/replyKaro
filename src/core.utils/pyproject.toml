[project]
name = "core-utils"
version = "0.1.0"
description = "Shared settings, constants and small helpers"
requires-python = ">=3.12"
dependencies = ["pydantic-settings>=2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["core"]
