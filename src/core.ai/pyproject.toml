[project]
name = "core-ai"
version = "0.1.0"
description = "Claude client, prompts, tools, guardrails and the sales-assistant loop"
requires-python = ">=3.12"
dependencies = ["core-utils", "core-db", "core-business", "anthropic>=2.6", "loguru>=0.7"]

[tool.uv.sources]
core-utils = { workspace = true }
core-db = { workspace = true }
core-business = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["core"]
