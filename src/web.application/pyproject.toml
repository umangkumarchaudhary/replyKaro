[project]
name = "web-application"
version = "0.1.0"
description = "FastAPI app: REST API, test chat page"
requires-python = ">=3.12"
dependencies = [
    "core-utils",
    "core-db",
    "core-business",
    "core-ai",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[tool.uv.sources]
core-utils = { workspace = true }
core-db = { workspace = true }
core-business = { workspace = true }
core-ai = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["web"]
