<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ReplyKaro Test Chat</title>
<style>
  :root { --bg:#efeae2; --panel:#fff; --me:#d9fdd3; --bot:#fff; --ink:#111b21; --muted:#667781; --brand:#008069; --line:#e9edef; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0b141a; --panel:#111b21; --me:#005c4b; --bot:#202c33; --ink:#e9edef; --muted:#8696a0; --brand:#00a884; --line:#222d34; }
  }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.4 system-ui, sans-serif; background:var(--bg); color:var(--ink); height:100dvh; display:flex; }
  .chat { flex:1; display:flex; flex-direction:column; min-width:0; }
  header { background:var(--brand); color:#fff; padding:12px 16px; display:flex; justify-content:space-between; align-items:center; }
  header small { opacity:.85; }
  #log { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:6px; }
  .msg { max-width:min(75%, 520px); padding:7px 10px; border-radius:8px; white-space:pre-wrap; word-wrap:break-word; box-shadow:0 1px .5px rgba(0,0,0,.13); }
  .customer { align-self:flex-end; background:var(--me); }
  .bot { align-self:flex-start; background:var(--bot); }
  .sys { align-self:center; font-size:12px; color:var(--muted); background:var(--panel); padding:3px 10px; border-radius:6px; }
  form { display:flex; gap:8px; padding:10px; background:var(--panel); border-top:1px solid var(--line); }
  input { flex:1; padding:10px 14px; border-radius:20px; border:1px solid var(--line); background:var(--bg); color:var(--ink); font:inherit; }
  button { background:var(--brand); color:#fff; border:0; border-radius:20px; padding:0 18px; font:inherit; cursor:pointer; }
  button:disabled { opacity:.5; }
  aside { width:320px; background:var(--panel); border-left:1px solid var(--line); padding:16px; overflow-y:auto; font-size:13px; }
  aside h3 { margin:0 0 8px; font-size:14px; }
  aside pre { white-space:pre-wrap; background:var(--bg); padding:8px; border-radius:6px; margin:0 0 14px; }
  @media (max-width: 760px) { aside { display:none; } }
</style>
</head>
<body>
<div class="chat">
  <header><div><strong id="biz">ReplyKaro</strong><br><small>Test chat · AI sales assistant</small></div>
    <button id="reset" title="Start as a new customer">New customer</button></header>
  <div id="log"></div>
  <form id="f"><input id="t" placeholder="Type a message… (try Hinglish!)" autocomplete="off" autofocus><button id="send">Send</button></form>
</div>
<aside>
  <h3>Lead captured</h3><pre id="lead">—</pre>
  <h3>Last tool calls</h3><pre id="tools">—</pre>
  <h3>Status</h3><pre id="status">bot</pre>
</aside>
<script>
const slug = location.pathname.split("/").filter(Boolean).pop();
const api = (p) => `/api/${slug}${p}`;
const key = `rk_visitor_${slug}`;
let visitor;
try { visitor = localStorage.getItem(key); } catch {}
if (!visitor) newVisitor();
function newVisitor() { visitor = "web-" + Math.random().toString(36).slice(2, 10); try { localStorage.setItem(key, visitor); } catch {} }

const log = document.getElementById("log");
function add(role, text) {
  const d = document.createElement("div"); d.className = "msg " + role; d.textContent = text;
  log.appendChild(d); log.scrollTop = log.scrollHeight; return d;
}

fetch(api("/profile")).then(r => r.json()).then(p => { document.getElementById("biz").textContent = p.name || slug; });

async function refreshLead(convId) {
  const leads = await fetch(api("/leads")).then(r => r.json());
  const lead = leads.find(l => l.conversation_id === convId);
  document.getElementById("lead").textContent = lead
    ? Object.entries(lead).filter(([k, v]) => v && !["id","conversation_id","created_at","updated_at"].includes(k)).map(([k, v]) => `${k}: ${v}`).join("\n")
    : "—";
}

document.getElementById("f").addEventListener("submit", async (e) => {
  e.preventDefault();
  const input = document.getElementById("t"), btn = document.getElementById("send");
  const text = input.value.trim(); if (!text) return;
  input.value = ""; add("customer", text); btn.disabled = true;
  const typing = add("sys", "typing…");
  try {
    const r = await fetch(api("/chat"), { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({ visitor_id: visitor, text }) });
    const data = await r.json(); typing.remove();
    if (!r.ok) { add("sys", "Error: " + (data.detail || r.status)); return; }
    if (data.reply) add("bot", data.reply); else add("sys", "A team member has taken over this chat");
    document.getElementById("tools").textContent = data.tool_calls.length ? data.tool_calls.map(t => `${t.name}(${JSON.stringify(t.input)})`).join("\n\n") : "—";
    document.getElementById("status").textContent = data.status;
    refreshLead(data.conversation_id);
  } catch (err) { typing.remove(); add("sys", "Network error"); }
  finally { btn.disabled = false; input.focus(); }
});

document.getElementById("reset").addEventListener("click", () => {
  newVisitor(); log.innerHTML = ""; ["lead","tools"].forEach(id => document.getElementById(id).textContent = "—");
  document.getElementById("status").textContent = "bot"; add("sys", "New customer session");
});
</script>
</body>
</html>
