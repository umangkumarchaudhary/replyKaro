[[faqs]]
q = "What documents do I need for a test drive?"
a = "A valid driving licence and one government ID proof (Aadhaar, PAN, Passport or Voter ID)."

[[faqs]]
q = "Do you provide finance or car loans?"
a = "Yes, competitive financing with multiple banks and NBFCs. Our finance team helps choose the best option."

[[faqs]]
q = "What is the warranty on MG cars?"
a = "Vehicle warranty: 5 years or 1,20,000 km, whichever comes first. EV battery and motor: 8 years or 1,50,000 km. Extended warranty is available."

[[faqs]]
q = "Do you accept old car exchange?"
a = "Yes, any make and model. Free evaluation and an instant quote; the exchange value is adjusted against your new MG."

[[faqs]]
q = "Is home test drive available?"
a = "Available in select areas, subject to availability. The team will confirm."

[[faqs]]
q = "Do you provide pickup and drop for service?"
a = "Yes, complimentary pickup and drop within city limits for scheduled maintenance. Please book 24 hours in advance."

[[faqs]]
q = "Do you help with EV charging?"
a = "Our flagship showroom has EV charging stations, and we guide customers on home charger setup and public charging."
